# cc.conf: settings of the cc driver. Copy this file to "cc.conf" next to the
# executable "cc" and adjust it (cc.conf itself is local and not in git).
# Without cc.conf the built-in defaults (the WEGA paths) are used. The option
# -T<x><path> on the command line overrides these settings.
#
# A pass is a path, or a command with arguments (for example an emulator that
# runs the original WEGA program). Names that begin with "_" are private
# variables that can be used as ${_name}.

# Run the original passes of a WEGA file tree under z8k-emu:
_emu   = /mnt/share/cvs/P8000/WEGA/host/z8k-emu/z8k-emu -r /mnt/share/cvs/P8000/tmp/wega31_root

cpp    = ${_emu} /lib/cpp
cparse = ${_emu} /lib/cparse
gopt   = ${_emu} /lib/gopt
codgen = ${_emu} /lib/codgen
popt   = /mnt/share/cvs/P8000/WEGA/host/popt/popt
cas    = /mnt/share/cvs/P8000/WEGA/host/cas/cas
ld     = /mnt/share/cvs/P8000/WEGA/host/ld/ld

# Files that the passes read (guest paths when the passes run under the emulator):
crt0   = /lib/crt0.o
mcrt0  = /lib/mcrt0.o
libc   = /lib/libc.a

# Directory of the temporary files cc.<pid>.<x>. Under the emulator use "." (the
# working directory): a relative path means the same for cc and for the guest.
tmpdir = .

# Other settings (defaults): clist fpf fpe fpent libcfpf m4 basic f77 shell mv
#mv     = /bin/mv
