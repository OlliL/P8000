# ld.conf: settings of ld, sld and gld. Copy this file to "ld.conf" next to the programs (ld.conf
# itself is local and not in git). The environment ($WEGA_ROOT, $WEGA_LIBPATH) wins over this file.

# The file tree of the original system: absolute names (/lib/crt0.o, /lib/libc.a, -lc) are looked
# up below it when they do not exist as given.
root    = /mnt/share/cvs/P8000/tmp/wega31_root

# Directories of -l (colon separated); default /lib:/usr/lib:/z/bin
#libpath = /lib:/usr/lib:/z/bin
